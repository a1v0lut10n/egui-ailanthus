name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo test --workspace --all-features

  wasm:
    name: wasm32 check + trunk build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p egui_ailanthus --all-features --target wasm32-unknown-unknown
      - run: cargo check -p egui_ailanthus_demo --target wasm32-unknown-unknown
      - uses: jetli/trunk-action@v0.5.1
        with:
          version: "latest"
      - name: Build web demo
        working-directory: demo
        run: trunk build --release --public-url /egui-ailanthus/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: demo/dist

  # Pages needs a public repo (or a paid plan). Once available: enable Pages
  # with "Source: GitHub Actions" and set the repo variable DEPLOY_PAGES=true.
  # Until then the wasm job's artifact is the downloadable demo.
  deploy-demo:
    name: deploy web demo to GitHub Pages
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_PAGES == 'true'
    needs: wasm
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
