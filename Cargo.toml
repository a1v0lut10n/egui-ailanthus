[workspace]
members = ["demo"]

[package]
name = "egui_ailanthus"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Aivolution GmbH"]
description = "A decorated tree view widget for egui, named after Ailanthus altissima — the tree of heaven."
repository = "https://github.com/a1v0lut10n/egui-ailanthus"
license = "MIT OR Apache-2.0"
keywords = ["egui", "gui", "widget", "tree", "treeview"]
categories = ["gui"]
include = ["src/**/*.rs", "Cargo.toml", "LICENSE-MIT", "LICENSE-APACHE", "README.md"]

[dependencies]
egui = { version = "0.36", default-features = false }
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
# `inspection` lets any example serve the egui inspection protocol when run
# with EGUI_INSPECTION=1, so the egui MCP server can drive it.
eframe = { version = "0.36", features = ["persistence", "inspection"] }
egui_kittest = "0.36.1"

[features]
default = []
# Persist tree state (openness + selection) in egui memory across sessions.
# Adds serde bounds to node ids.
persistence = ["dep:serde", "egui/persistence"]

[[example]]
name = "persistence"
required-features = ["persistence"]
