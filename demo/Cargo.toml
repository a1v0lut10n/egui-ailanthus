[package]
name = "egui_ailanthus_demo"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Playground demo for egui_ailanthus: every setting and decoration, native and wasm."

[dependencies]
egui = "0.36"
egui_ailanthus = { path = ".." }

# `inspection` (native only) lets the demo serve the egui inspection protocol
# when run with EGUI_INSPECTION=1, so the egui MCP server can drive it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.36", features = ["inspection"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = "0.36"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement"] }
